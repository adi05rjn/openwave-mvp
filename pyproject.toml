[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openwave-mvp"
version = "0.1.0"
description = "Research-oriented RF/microwave eigenmode solver MVP inspired by HFSS workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
mcp = ["mcp>=2.0,<3; python_version >= '3.11'"]

[project.scripts]
openwave = "openwave.cli:main"
openwave-gui = "openwave.gui:main"
openwave-mcp = "openwave.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openwave = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
