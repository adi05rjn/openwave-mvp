name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Create a clean Python environment
        run: python -m venv .venv
      - name: Install declared project dependencies
        run: .venv/bin/python -m pip install -e ".[dev]"
      - name: Run numerical regression tests
        run: .venv/bin/python -m pytest -q
      - name: Run WR-90 simulation and generate a plot
        env:
          MPLBACKEND: Agg
        run: |
          .venv/bin/openwave --width-mm 22.86 --height-mm 10.16 --modes 4 --plot artifacts/wr90.png
          test -s artifacts/wr90.png
